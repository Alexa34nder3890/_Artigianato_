spring.application.name=artigiani_webapp

# H2 DataSource
spring.datasource.url=jdbc:h2:../databases/artigiani_webapp-DB;AUTO_SERVER=TRUE
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# File storage path (cartella locale)
app.upload.dir=src/main/resources/static/uploads

# ── URL base del sito (usato nei link nelle email) ──────────────────────────
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ── Configurazione SMTP per recupero password ────────────────────────────────
# Le credenziali sono lette da variabili d'ambiente; non inserire mai valori reali qui.
# Esempio con Gmail (richiede "App Password" se hai 2FA attiva):
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
