<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{bases/head.html}"></head>
<body class="bg-cream font-sans text-charcoal min-h-screen flex flex-col">

<nav th:replace="~{bases/navbar.html}"></nav>

<main class="flex-1">

    <!-- ══════════════════════════════════════════════════════════
         INTESTAZIONE
    ══════════════════════════════════════════════════════════ -->
    <section class="bg-charcoal py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <a href="/products" class="inline-flex items-center gap-2 text-cream/60 hover:text-clay text-sm mb-6 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                Scegli una regione
            </a>
            <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
                <div>
                    <p class="text-clay uppercase tracking-widest text-xs font-medium mb-1">Tutto il catalogo</p>
                    <h1 class="font-serif text-4xl font-bold text-cream">Made in Italy</h1>
                    <p class="text-cream/50 mt-2">Pezzi unici realizzati da maestri artigiani italiani</p>
                </div>
                <p id="resultCount" class="text-cream/40 text-sm font-medium"></p>
            </div>
        </div>
    </section>

    <!-- ══════════════════════════════════════════════════════════
         PANNELLO FILTRI
    ══════════════════════════════════════════════════════════ -->
    <section class="bg-white border-b border-cream-dark shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">

            <!-- Riga superiore: ricerca + reset -->
            <div class="flex items-center gap-3 mb-4">
                <div class="relative flex-1">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 h-4 w-4 text-charcoal/40"
                         xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
                    </svg>
                    <input type="text" id="searchInput"
                           placeholder="Cerca prodotto o artigiano…"
                           class="w-full pl-11 pr-4 py-2.5 rounded-xl border border-cream-dark bg-cream/60
                                  focus:outline-none focus:ring-2 focus:ring-clay/30 focus:border-clay
                                  text-sm transition-all duration-200">
                </div>
                <button onclick="resetFilters()"
                        class="flex items-center gap-1.5 text-xs font-semibold text-charcoal/50
                               hover:text-clay transition-colors px-3 py-2 rounded-xl hover:bg-cream">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    Reset
                </button>
            </div>

            <!-- Filtri chip -->
            <div class="flex flex-col gap-3">

                <!-- Categoria -->
                <div class="flex items-start gap-3">
                    <span class="filter-label-tag">Categoria</span>
                    <div class="flex flex-wrap gap-1.5" id="category-chips">
                        <button class="fchip active" data-filter="category" data-value="">Tutte</button>
                        <!-- categorie popolate da JS -->
                    </div>
                </div>

                <!-- Città -->
                <div class="flex items-start gap-3" th:if="${!cities.isEmpty()}">
                    <span class="filter-label-tag">Città</span>
                    <div class="flex flex-wrap gap-1.5" id="city-chips">
                        <button class="fchip active" data-filter="city" data-value="">Tutte</button>
                        <span th:each="city : ${cities}">
                            <button class="fchip"
                                    th:text="${city}"
                                    th:attr="data-value=${city}"
                                    data-filter="city">
                            </button>
                        </span>
                    </div>
                </div>

                <!-- Artigiano -->
                <div class="flex items-start gap-3">
                    <span class="filter-label-tag">Artigiano</span>
                    <div class="flex flex-wrap gap-1.5" id="artisan-chips">
                        <button class="fchip active" data-filter="artisan" data-value="">Tutti</button>
                        <!-- artigiani popolati da JS -->
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- ══════════════════════════════════════════════════════════
         GRIGLIA PRODOTTI
    ══════════════════════════════════════════════════════════ -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">

        <div th:if="${!products.isEmpty()}"
             id="productGrid"
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

            <div th:each="product : ${products}"
                 class="product-card bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl
                        transition-all duration-300 hover:-translate-y-1 border border-cream-dark group"
                 th:attr="data-name=${product.name.toLowerCase()},
                          data-artisan=${product.artisan.name.toLowerCase()},
                          data-artisan-display=${product.artisan.name},
                          data-location=${product.artisan.location != null ? product.artisan.location.toLowerCase() : ''},
                          data-location-display=${product.artisan.location != null ? product.artisan.location : ''},
                          data-category=${product.category != null ? product.category.toLowerCase() : ''},
                          data-category-display=${product.category != null ? product.category : ''}">

                <!-- Immagine -->
                <div class="relative overflow-hidden h-52">
                    <img th:if="${product.imageUrl != null}"
                         th:src="${product.imageUrl}" th:alt="${product.name}"
                         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div th:unless="${product.imageUrl != null}"
                         class="w-full h-full bg-cream-dark flex items-center justify-center">
                        <span class="text-5xl">🏺</span>
                    </div>
                    <span class="absolute top-3 left-3 bg-charcoal/80 text-cream text-xs px-3 py-1 rounded-full backdrop-blur-sm"
                          th:text="${product.category}"></span>
                    <span th:if="${product.model3dUrl != null}"
                          class="absolute top-3 right-3 bg-clay text-white text-xs px-3 py-1 rounded-full">3D</span>
                </div>

                <!-- Info -->
                <div class="p-5">
                    <p class="text-xs text-clay font-medium mb-1" th:text="${product.artisan.name}"></p>
                    <h3 class="font-serif text-base font-semibold text-charcoal mb-1 line-clamp-2"
                        th:text="${product.name}"></h3>
                    <p th:if="${product.artisan.location != null}"
                       class="text-xs text-charcoal/40 flex items-center gap-1 mb-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                        </svg>
                        <span th:text="${product.artisan.location}"></span>
                    </p>
                    <div class="flex items-center justify-between">
                        <span class="text-lg font-bold text-clay"
                              th:text="'€' + ${#numbers.formatDecimal(product.price, 1, 2)}"></span>
                        <a th:href="@{/products/{id}(id=${product.id})}"
                           class="bg-charcoal hover:bg-clay text-white text-sm px-4 py-2 rounded-lg transition-colors duration-200">
                            Vedi →
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stato vuoto iniziale -->
        <div th:if="${products.isEmpty()}" class="text-center py-20">
            <p class="text-charcoal/60 text-lg mt-4">Nessun prodotto ancora disponibile.</p>
        </div>

        <!-- Stato vuoto da filtro (JS) -->
        <div id="noResults" class="hidden text-center py-20">
            <span class="text-5xl">🔍</span>
            <p class="text-charcoal/60 text-lg mt-4">Nessun prodotto trovato.</p>
            <button data-action="reset" class="text-clay hover:underline mt-2 text-sm">
                Rimuovi filtri
            </button>
        </div>

    </section>
</main>

<footer th:replace="~{bases/footer.html}"></footer>
<script th:replace="~{bases/scripts.html}"></script>

<style>
.filter-label-tag {
    flex-shrink: 0;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(61,48,40,0.45);
    padding-top: 5px;
    min-width: 56px;
}
.fchip {
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 600;
    background: white;
    color: #3d3028;
    border: 1.5px solid #e8ddd5;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
}
.fchip:hover  { border-color: #C45C2E; color: #C45C2E; }
.fchip.active { background: #C45C2E; color: white; border-color: #C45C2E; }
</style>

<script>
/* ══════════════════════════════════════════════════════════
   FILTRI CLIENT-SIDE
   Nessun onclick inline nell'HTML — tutto gestito da event
   delegation, compatibile con Thymeleaf 3.1+ security model.
══════════════════════════════════════════════════════════ */
var activeFilters = { category: '', city: '', artisan: '' };

function setFilter(type, value) {
    activeFilters[type] = value;
    document.querySelectorAll('[data-filter="' + type + '"]').forEach(function (c) {
        c.classList.toggle('active', c.dataset.value === value);
    });
    applyFilters();
}

function applyFilters() {
    var query   = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    var cards   = document.querySelectorAll('.product-card');
    var visible = 0;

    cards.forEach(function (card) {
        var name     = card.dataset.name     || '';
        var artisan  = card.dataset.artisan  || '';
        var location = card.dataset.location || '';
        var category = card.dataset.category || '';

        var matchSearch  = !query || name.includes(query) || artisan.includes(query) || location.includes(query);
        var matchCat     = !activeFilters.category || category === activeFilters.category.toLowerCase();
        var matchCity    = !activeFilters.city     || location.includes(activeFilters.city.toLowerCase());
        var matchArtisan = !activeFilters.artisan  || artisan.includes(activeFilters.artisan.toLowerCase());

        var show = matchSearch && matchCat && matchCity && matchArtisan;
        card.style.display = show ? '' : 'none';
        if (show) visible++;
    });

    var noResults = document.getElementById('noResults');
    if (noResults) noResults.classList.toggle('hidden', visible > 0 || cards.length === 0);

    var counter = document.getElementById('resultCount');
    if (counter && cards.length > 0) {
        counter.textContent = visible === cards.length
            ? visible + ' prodotti'
            : visible + ' di ' + cards.length + ' prodotti';
    }
}

function resetFilters() {
    activeFilters = { category: '', city: '', artisan: '' };
    document.querySelectorAll('.fchip').forEach(function (c) {
        c.classList.toggle('active', c.dataset.value === '');
    });
    document.getElementById('searchInput').value = '';
    applyFilters();
}

/* ── Event delegation: un solo listener per tutti i chip ── */
window.addEventListener('DOMContentLoaded', function () {

    /* Click su qualsiasi .fchip → legge data-filter e data-value */
    document.addEventListener('click', function (e) {
        var chip = e.target.closest('.fchip');
        if (chip) {
            setFilter(chip.dataset.filter, chip.dataset.value || '');
            return;
        }
        /* Bottone reset */
        if (e.target.closest('[data-action="reset"]')) {
            resetFilters();
        }
    });

    /* Ricerca testuale */
    document.getElementById('searchInput').addEventListener('input', applyFilters);

    /* Popola dinamicamente categorie e artigiani dai prodotti */
    var cards      = document.querySelectorAll('.product-card');
    var categories = new Set();
    var artisans   = new Set();

    cards.forEach(function (card) {
        if (card.dataset.categoryDisplay) categories.add(card.dataset.categoryDisplay);
        if (card.dataset.artisanDisplay)  artisans.add(card.dataset.artisanDisplay);
    });

    function addChips(containerId, filterType, values) {
        var container = document.getElementById(containerId);
        if (!container) return;
        values.forEach(function (val) {
            var btn = document.createElement('button');
            btn.className      = 'fchip';
            btn.dataset.filter = filterType;
            btn.dataset.value  = val;
            btn.textContent    = val;
            container.appendChild(btn);
        });
    }

    addChips('category-chips', 'category', Array.from(categories).sort());
    addChips('artisan-chips',  'artisan',  Array.from(artisans).sort());

    /* ── Filtro artigiano da URL (?artisan=Nome) ──
       Arriva dalla pagina /artisans quando si clicca "Vedi prodotti →".
       Cerca il chip con il nome corrispondente (case-insensitive) e lo attiva. */
    var urlParams    = new URLSearchParams(window.location.search);
    var artisanParam = urlParams.get('artisan');
    if (artisanParam) {
        var normalised  = artisanParam.trim().toLowerCase();
        var matchedChip = null;
        document.querySelectorAll('[data-filter="artisan"]').forEach(function (chip) {
            if (chip.dataset.value && chip.dataset.value.toLowerCase() === normalised) {
                matchedChip = chip;
            }
        });
        if (matchedChip) {
            setFilter('artisan', matchedChip.dataset.value);
            /* Scrolla morbidamente alla griglia prodotti */
            var grid = document.getElementById('productGrid');
            if (grid) { setTimeout(function () { grid.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100); }
        } else {
            applyFilters();
        }
    } else {
        applyFilters();
    }
});
</script>
</body>
</html>
