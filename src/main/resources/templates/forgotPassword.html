<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{bases/head.html}"></head>
<body class="bg-cream font-sans text-charcoal min-h-screen flex flex-col">

<nav th:replace="~{bases/navbar.html}"></nav>

<main class="flex-1 flex items-center justify-center py-16 px-4">
    <div class="bg-white rounded-2xl shadow-lg p-10 w-full max-w-md border border-cream-dark">

        <div class="text-center mb-8">
            <h1 class="font-serif text-3xl font-bold text-charcoal mt-3 mb-1">Password dimenticata?</h1>
            <p class="text-charcoal/60 text-sm">
                Inserisci la tua email e ti manderemo un link per reimpostarla.
            </p>
        </div>

        <!-- Messaggio di conferma (dopo invio) -->
        <div th:if="${sent}"
             class="bg-green-50 border border-green-200 text-green-800 rounded-xl px-4 py-4 mb-6 text-sm text-center">
            <p class="font-semibold mb-1">Email inviata!</p>
            <p>
                Se l'indirizzo è registrato, riceverai un link per reimpostare la password.
                Controlla anche la cartella spam.
            </p>
        </div>

        <!-- Form (nascosto dopo l'invio) -->
        <form th:unless="${sent}" th:action="@{/forgot-password}" method="post" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-medium text-charcoal mb-1">
                    Indirizzo email
                </label>
                <input type="email" id="email" name="email" required
                       class="w-full border border-cream-dark rounded-lg px-4 py-3 text-charcoal bg-cream
                              focus:outline-none focus:ring-2 focus:ring-clay/50 focus:border-clay transition-colors"
                       placeholder="la-tua@email.it">
            </div>

            <button type="submit"
                    class="w-full bg-clay hover:bg-clay-dark text-white py-3 rounded-xl font-semibold
                           text-base transition-all duration-300 hover:shadow-md hover:-translate-y-0.5">
                Invia link di recupero
            </button>
        </form>

        <div class="text-center mt-6 text-sm text-charcoal/60 space-y-1">
            <p><a th:href="@{/login}" class="text-clay font-medium hover:underline">← Torna al login</a></p>
            <p>Non hai un account? <a th:href="@{/signup}" class="text-clay font-medium hover:underline">Registrati gratis</a></p>
        </div>

    </div>
</main>

<footer th:replace="~{bases/footer.html}"></footer>
<script th:replace="~{bases/scripts.html}"></script>
</body>
</html>
