<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{bases/head.html}"></head>
<body class="bg-cream font-sans text-charcoal min-h-screen flex flex-col">

<nav th:replace="~{bases/navbar.html}"></nav>

<main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">

    <!-- Breadcrumb -->
    <nav class="text-sm text-charcoal/50 mb-8">
        <a th:href="@{/products}" class="hover:text-clay transition-colors">Prodotti</a>
        <span class="mx-2">/</span>
        <span th:text="${product.name}" class="text-charcoal"></span>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">

        <!-- Colonna sinistra: Visualizzatore 3D + immagine -->
        <div class="space-y-4">

            <!-- Visualizzatore 3D con model-viewer (se disponibile) -->
            <div th:if="${product.model3dUrl != null}"
                 class="bg-white rounded-2xl overflow-hidden border border-cream-dark shadow-sm aspect-square">
                <model-viewer
                    th:attr="src=${product.model3dUrl}, alt=${product.name}"
                    auto-rotate
                    camera-controls
                    shadow-intensity="1"
                    style="width: 100%; height: 100%;">
                </model-viewer>
            </div>

            <!-- Immagine di anteprima (fallback o complementare) -->
            <div th:if="${product.imageUrl != null}"
                 class="bg-white rounded-2xl overflow-hidden border border-cream-dark shadow-sm">
                <img th:src="${product.imageUrl}"
                     th:alt="${product.name}"
                     class="w-full h-80 object-cover">
            </div>

        </div>

        <!-- Colonna destra: Dettagli prodotto -->
        <div class="flex flex-col justify-start space-y-6">

            <!-- Categoria e nome -->
            <div>
                <span class="text-clay text-sm font-medium uppercase tracking-wider"
                      th:text="${product.category}"></span>
                <h1 class="font-serif text-4xl font-bold text-charcoal mt-2 mb-1"
                    th:text="${product.name}"></h1>
            </div>

            <!-- Artigiano -->
            <div class="flex items-center gap-3 bg-cream-dark/50 rounded-xl px-4 py-3">
                <div>
                    <p class="text-xs text-charcoal/50 uppercase tracking-wide">Artigiano</p>
                    <p class="font-semibold text-charcoal" th:text="${product.artisan.name}"></p>
                    <p class="text-sm text-charcoal/60 mt-1" th:text="${product.artisan.biography}"></p>
                </div>
            </div>

            <!-- Descrizione -->
            <div>
                <h2 class="font-semibold text-charcoal mb-2">Descrizione</h2>
                <p class="text-charcoal/70 leading-relaxed" th:text="${product.description}"></p>
            </div>

            <!-- Prezzo e aggiungi al carrello -->
            <div class="bg-white border border-cream-dark rounded-2xl p-6 space-y-4">
                <div class="flex items-center justify-between">
                    <span class="text-charcoal/60 text-sm">Prezzo</span>
                    <span class="font-serif text-3xl font-bold text-clay"
                          th:text="'€' + ${#numbers.formatDecimal(product.price, 1, 2)}"></span>
                </div>

                <form th:action="@{/cart/add}" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <div class="flex gap-3">
                        <input type="number" name="quantity" value="1" min="1"
                               class="w-20 border border-cream-dark rounded-lg px-3 py-3 text-center bg-cream focus:outline-none focus:ring-2 focus:ring-clay/50">
                        <button type="submit"
                                class="flex-1 bg-clay hover:bg-clay-dark text-white py-3 rounded-xl font-semibold transition-all duration-300 hover:shadow-md hover:-translate-y-0.5">
                              Aggiungi al Carrello
                        </button>
                    </div>
                </form>

                <p class="text-xs text-charcoal/40 text-center">
                    Pagamento sicuro con Stripe
                </p>
            </div>

        </div>
    </div>

</main>

<footer th:replace="~{bases/footer.html}"></footer>
<script th:replace="~{bases/scripts.html}"></script>
</body>
</html>
