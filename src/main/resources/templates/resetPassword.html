<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{bases/head.html}"></head>
<body class="bg-cream font-sans text-charcoal min-h-screen flex flex-col">

<nav th:replace="~{bases/navbar.html}"></nav>

<main class="flex-1 flex items-center justify-center py-16 px-4">
    <div class="bg-white rounded-2xl shadow-lg p-10 w-full max-w-md border border-cream-dark">

        <div class="text-center mb-8">
            <h1 class="font-serif text-3xl font-bold text-charcoal mt-3 mb-1">Nuova password</h1>
            <p class="text-charcoal/60 text-sm">Scegli una nuova password sicura per il tuo account.</p>
        </div>

        <!-- Successo -->
        <div th:if="${success}"
             class="bg-green-50 border border-green-200 text-green-800 rounded-xl px-4 py-4 mb-6 text-sm text-center">
            <p class="font-semibold mb-1"> Password aggiornata!</p>
            <p>Puoi ora accedere con la tua nuova password.</p>
            <a th:href="@{/login}"
               class="inline-block mt-4 bg-clay hover:bg-clay-dark text-white px-6 py-2 rounded-xl
                      font-semibold text-sm transition-all duration-300">
                Vai al login →
            </a>
        </div>

        <!-- Errore (token scaduto o già usato) -->
        <div th:if="${error != null and token == null}"
             class="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 mb-6 text-sm">
            <p th:text="${error}"></p>
            <a th:href="@{/forgot-password}"
               class="inline-block mt-3 text-clay font-medium hover:underline text-sm">
                → Richiedi un nuovo link
            </a>
        </div>

        <!-- Form reset (mostrato solo se il token è valido) -->
        <form th:if="${token != null and success == null}"
              th:action="@{/reset-password}" method="post" class="space-y-5"
              id="resetForm">

            <input type="hidden" name="token" th:value="${token}">

            <!-- Errore validazione (password non coincidono ecc.) -->
            <div th:if="${error}"
                 class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm">
                <span th:text="${error}"></span>
            </div>

            <div>
                <label for="newPassword" class="block text-sm font-medium text-charcoal mb-1">
                    Nuova password <span class="text-charcoal/40 font-normal">(min. 8 caratteri)</span>
                </label>
                <input type="password" id="newPassword" name="newPassword" required minlength="8"
                       class="w-full border border-cream-dark rounded-lg px-4 py-3 text-charcoal bg-cream
                              focus:outline-none focus:ring-2 focus:ring-clay/50 focus:border-clay transition-colors"
                       placeholder="••••••••">
            </div>

            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-charcoal mb-1">
                    Conferma password
                </label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8"
                       class="w-full border border-cream-dark rounded-lg px-4 py-3 text-charcoal bg-cream
                              focus:outline-none focus:ring-2 focus:ring-clay/50 focus:border-clay transition-colors"
                       placeholder="••••••••">
                <p id="matchError" class="text-red-500 text-xs mt-1 hidden">Le password non coincidono.</p>
            </div>

            <button type="submit"
                    class="w-full bg-clay hover:bg-clay-dark text-white py-3 rounded-xl font-semibold
                           text-base transition-all duration-300 hover:shadow-md hover:-translate-y-0.5">
                Salva nuova password
            </button>
        </form>

        <p class="text-center mt-6 text-sm">
            <a th:href="@{/login}" class="text-clay font-medium hover:underline">← Torna al login</a>
        </p>

    </div>
</main>

<footer th:replace="~{bases/footer.html}"></footer>
<script th:replace="~{bases/scripts.html}"></script>
<script>
    // Validazione client-side: evidenzia mismatch in tempo reale
    const np = document.getElementById('newPassword');
    const cp = document.getElementById('confirmPassword');
    const err = document.getElementById('matchError');
    if (cp) {
        cp.addEventListener('input', () => {
            err.classList.toggle('hidden', np.value === cp.value || cp.value === '');
        });
    }
    // Blocca submit se non coincidono
    const form = document.getElementById('resetForm');
    if (form) {
        form.addEventListener('submit', e => {
            if (np.value !== cp.value) { e.preventDefault(); err.classList.remove('hidden'); }
        });
    }
</script>
</body>
</html>
